services:
  astron:
    image: ${ASTRON_IMAGE:-ghcr.io/voarsh2/astron:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "6660:6660"
      - "6667:6667"
    volumes:
      - astron-yaml-data:/var/lib/astron/database
    restart: unless-stopped

  astron-postgresql:
    profiles: [postgresql]
    image: ${ASTRON_IMAGE:-ghcr.io/voarsh2/astron:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6660:6660"
      - "6667:6667"
    command: ["-l", "info", "/etc/astron/astron.yml"]
    restart: unless-stopped

  postgres:
    profiles: [postgresql]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: astron
      POSTGRES_USER: astron
      POSTGRES_PASSWORD: astron
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astron -d astron"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - astron-postgres:/var/lib/postgresql/data

  astron-mongodb:
    profiles: [mongodb]
    image: ${ASTRON_MONGODB_IMAGE:-ghcr.io/voarsh2/astron:mongodb-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-mongodb
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "6660:6660"
      - "6667:6667"
    command: ["-l", "info", "/etc/astron/astron-mongo.yml"]
    restart: unless-stopped

  mongodb:
    profiles: [mongodb]
    # Use 7.0 by default for Linux hosts affected by MongoDB 8.0's
    # TCMalloc/rseq incompatibility and Ubuntu kernel-version misdetection.
    # Override only on a verified-compatible host/image (SERVER-121912,
    # SERVER-136848).
    image: ${ASTRON_MONGO_IMAGE:-mongo:7.0}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - astron-mongodb-data:/data/db

volumes:
  astron-postgres:
  astron-yaml-data:
  astron-mongodb-data:
